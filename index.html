<script>
const KEY="edm_school_v1",DN=["Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"],MO=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentyabr","oktyabr","noyabr","dekabr"];

const ROLES={owner:"Owner",director:"Direktor",admin:"Admin",teacher:"O'qituvchi",student:"O'quvchi"};
const $=s=>document.querySelector(s),esc=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const z=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
let TODAY=iso(new Date());
const tgApp=window.Telegram?.WebApp;
if(tgApp){try{tgApp.ready();tgApp.expand();if(tgApp.colorScheme)document.documentElement.dataset.theme=tgApp.colorScheme;if(tgApp.BackButton){tgApp.BackButton.onClick(()=>{if(ui.dr)A.back();else if(ui.pg!=="dash")A.nav({p:"dash"})})}}catch(e){}}
async function refreshToday(){try{const res=await fetch("/api/v1/bootstrap",{credentials:"include"});if(res.ok){const j=await res.json();if(j.data?.today&&j.data.today!==TODAY){TODAY=j.data.today;render()}}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshToday()});
setInterval(refreshToday,60000);
const addD=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)},wd=s=>(new Date(s+"T12:00:00").getDay()+6)%7;
const fd=s=>{const d=new Date(s+"T12:00:00");return d.getDate()+" "+MO[d.getMonth()]+", "+(DN[wd(s)]||"yakshanba").toLowerCase()};
let D,ui={pg:"dash",date:TODAY,f:{from:addD(TODAY,-30),to:TODAY},m:null,dr:null,q:"",gq:"",isLoggedIn:false,authUser:null,userMenu:null,userPermissions:null,needPhone:false,mustChangePassword:false,loginErr:null,usersList:[],schoolsList:[],usersLoaded:false,schoolsLoaded:false};
const by=(k,id)=>D[k].find(x=>x.id==id),nm=(k,id)=>{const x=by(k,id);return x?x.name:"—"},act=k=>D[k].filter(x=>x.st=="a");
const yr=()=>D.years.find(y=>y.on)||D.years[0]||{id:0,name:"—"};
const can=p=>{const r=ui.authUser?.role||D?.me?.role||"owner";if(r=="owner")return true;if(Array.isArray(ui.userPermissions)&&ui.userPermissions.includes(p))return true;return!!(D?.perm?.[r]&&D.perm[r].includes(p))};
function seed(old){const d={v:1,n:1,log:[],theme:"",me:{role:"owner",id:0}},u=()=>d.n++;
 d.school={name:"Xatirchi tumani 65-maktab",addr:"",phone:"",logo:"🎓",days:[0,1,2,3,4,5],times:["08:00-08:45","08:50-09:35","09:45-10:30","10:35-11:20","11:30-12:15","12:20-13:05"]};
 const y1=u();d.years=[{id:y1,name:"2024–2025",on:1}];
 d.perm={owner:PERMS.slice(),director:PERMS.slice(),admin:PERMS.filter(p=>p!="MANAGE_SETTINGS"),teacher:["VIEW_STUDENTS","MARK_ATTENDANCE","VIEW_REPORTS","EXPORT_DATA"],student:[]};
 d.subjects=["Matematika|MAT|#3b5bdb","Ona tili|ONA|#e64980","Ingliz tili|ENG|#0ca678","Fizika|FIZ|#f76707","Kimyo|KIM|#1098ad","Biologiya|BIO|#2b8a3e","Tarix|TAR|#7048e8","Informatika|INF|#1098ad","Geografiya|GEO|#f59f00","Jismoniy tarbiya|JIS|#862e9c"].map(s=>{const a=s.split("|");return{id:u(),name:a[0],code:a[1],color:a[2],st:"a"}});
 d.teachers=[];d.classes=[];d.students=[];d.assigns=[];d.sched=[];d.ses={};
 return d}
function valid(x){return x&&typeof x=="object"&&["years","subjects","teachers","classes","students","assigns","sched"].every(k=>Array.isArray(x[k]))&&x.ses&&typeof x.ses=="object"&&x.school&&x.perm&&x.me&&Array.isArray(x.log)}
const Store={get:()=>localStorage.getItem(KEY),set:s=>localStorage.setItem(KEY,s)};
let _authToken=localStorage.getItem("edm_token")||"";
try{const _uP=new URLSearchParams(window.location.search);const _t=_uP.get("token");if(_t){_authToken=_t;localStorage.setItem("edm_token",_t)}}catch(e){}
async function apiReq(url,method="GET",body=null){
  const opts={method,headers:{},credentials:"include"};
  if(_authToken)opts.headers["Authorization"]="Bearer "+_authToken;
  if(body){opts.headers["Content-Type"]="application/json";opts.body=JSON.stringify(body)}
  const res=await fetch("/api/v1"+url,opts);
  const json=await res.json().catch(()=>({}));
  if(json.token||json.sessionToken){
    _authToken=json.token||json.sessionToken;
    localStorage.setItem("edm_token",_authToken);
  }
  if(!res.ok){
    const err=new Error(json.error||"Xatolik yuz berdi");
    err.status=res.status;
    err.data=json;
    throw err;
  }
  return json;
}
let _authPollTimer=null;
function startAuthPolling(){if(_authPollTimer)return;_authPollTimer=setInterval(async()=>{if(ui.isLoggedIn){clearInterval(_authPollTimer);_authPollTimer=null;return}const tgInit=window.Telegram?.WebApp?.initData;if(tgInit){try{const r=await apiReq("/auth/telegram","POST",{initData:tgInit});if(r.status==="ok"){if(r.sessionToken){_authToken=r.sessionToken;localStorage.setItem("edm_token",_authToken)}clearInterval(_authPollTimer);_authPollTimer=null;toast("Muvaffaqiyatli kirdingiz! 🎉");await refreshData()}}catch(e){}}},2000)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!ui.isLoggedIn){refreshData()}});
async function refreshData(){try{const hdrs={};if(_authToken)hdrs["Authorization"]="Bearer "+_authToken;const res=await fetch("/api/v1/bootstrap",{credentials:"include",headers:hdrs});if(res.status===401){const tgInit=window.Telegram?.WebApp?.initData;if(tgInit){try{const authRes=await apiReq("/auth/telegram","POST",{initData:tgInit});if(authRes.status==="ok"){if(authRes.sessionToken){_authToken=authRes.sessionToken;localStorage.setItem("edm_token",_authToken)}if(_authPollTimer){clearInterval(_authPollTimer);_authPollTimer=null}return await refreshData()}else if(authRes.need_phone){ui.needPhone=true;startAuthPolling()}}catch(e){}}ui.isLoggedIn=false;ui.authUser=null;render();return false}if(_authPollTimer){clearInterval(_authPollTimer);_authPollTimer=null}const json=await res.json();if(json.status==="ok"){D=json.data;if(json.data.today)TODAY=json.data.today;ui.isLoggedIn=true;try{const meHdrs={};if(_authToken)meHdrs["Authorization"]="Bearer "+_authToken;const meRes=await fetch("/api/v1/auth/me",{credentials:"include",headers:meHdrs});if(meRes.ok){const meJson=await meRes.json();ui.authUser=meJson.user;ui.userMenu=meJson.menu;ui.userPermissions=meJson.permissions;ui.mustChangePassword=!!meJson.user?.must_change_password;if(ui.authUser){if(!D.me)D.me={};D.me.role=ui.authUser.role;if(ui.authUser.teacher_id)D.me.id=ui.authUser.teacher_id;else if(ui.authUser.student_id)D.me.id=ui.authUser.student_id;}}}catch(e){}fix();render();flushOfflineQueue();return true}}catch(e){console.warn("Backend ulanmadi, kesh ishlatilmoqda",e)}return false}
async function flushOfflineQueue(){const raw=localStorage.getItem("edm_offline_queue");if(!raw)return;let q=[];try{q=JSON.parse(raw)}catch{return}if(!q.length)return;const rem=[];for(const it of q){try{await apiReq("/attendance/sessions/"+it.slotId+"/"+it.date,"PUT",{version:it.version,records:it.records,status:it.status||'draft'})}catch(e){if(e.status===409)toast("Offline davomat ziddiyati (409)",1);else rem.push(it)}}if(rem.length)localStorage.setItem("edm_offline_queue",JSON.stringify(rem));else{localStorage.removeItem("edm_offline_queue");toast("Offline davomatlar serverga yuklandi ✓")}}
window.addEventListener("online",flushOfflineQueue);
function load(){refreshData().then(ok=>{if(!ok&&!D){let raw=null;try{raw=Store.get();D=raw?JSON.parse(raw):null}catch(e){D=null}if(!D)D=seed();fix();render()}})}
function fix(){const S=D.school=D.school||{};S.days=Array.isArray(S.days)&&S.days.length?S.days:[0,1,2,3,4];S.times=Array.isArray(S.times)&&S.times.length?S.times:["08:00-08:45"];S.name=S.name||"Maktab";S.addr=S.addr||"";S.phone=S.phone||"";S.logo=S.logo||"🎓";["owner","admin","teacher","student"].forEach(r=>{if(!Array.isArray(D.perm[r]))D.perm[r]=[]});D.n=Math.max(D.n||1,...[].concat(D.years,D.subjects,D.teachers,D.classes,D.students,D.assigns,D.sched).map(x=>(+x.id||0)+1));if(!D.years.length)D.years.push({id:D.n++,name:"—",on:1});if(!Array.isArray(D.perm.director))D.perm.director=PERMS.slice();D.theme=D.theme||"";D.sent=D.sent||{};D.excuse=D.excuse||{};D.sched=D.sched.filter(x=>by("assigns",x.aid))}
const save=()=>{try{Store.set(JSON.stringify(D));return 1}catch(e){toast("Brauzer xotirasiga yozib bo'lmadi",1);return 0}};
const toast=(t,e)=>{const el=document.createElement("div");el.textContent=t;if(e)el.className="e";$("#ts").appendChild(el);setTimeout(()=>el.remove(),2400)};
const lg=t=>{D.log.unshift([Date.now(),t,D.me.role]);D.log=D.log.slice(0,80)};
const tm=t=>{const d=new Date(t);return d.getDate()+" "+MO[d.getMonth()]+" "+z(d.getHours())+":"+z(d.getMinutes())};
const pcol=v=>v==null?"var(--mu)":v<75?"var(--r)":v<90?"var(--y)":"var(--g)",pp=v=>v==null?"–":v+"%",pill=(t,c)=>`<span class="pl" style="background:${c}">${esc(t)}</span>`;
const ctOf=()=>D.me.role=="teacher"?D.classes.filter(c=>c.tid==D.me.id&&c.st=="a").map(c=>c.id):[];
function recs(f){const o=[];for(const k in D.ses){const s=D.ses[k];if(f.from&&s.date<f.from||f.to&&s.date>f.to||f.cid&&s.cid!=f.cid||f.sid&&s.sid!=f.sid||f.tid&&s.tid!=f.tid)continue;
 if(D.me.role=="teacher"&&s.tid!=D.me.id&&!ctOf().includes(s.cid))continue;for(const id in s.recs){if(f.stid&&id!=f.stid)continue;if(f.ids&&!f.ids.includes(+id))continue;o.push({s,id:+id,v:s.recs[id]})}}return o}
const tally=r=>{const c={p:0,a:0,l:0,e:0,t:r.length};r.forEach(x=>c[x.v]++);c.pct=c.t?Math.round((c.t-c.a)/c.t*100):null;return c};
function visClasses(){const r=D.me.role,a=act("classes");if(r=="teacher"){const ids=new Set(D.assigns.filter(x=>x.tid==D.me.id).map(x=>x.cid));ctOf().forEach(i=>ids.add(i));return a.filter(c=>ids.has(c.id))}if(r=="student"){const s=by("students",D.me.id);return a.filter(c=>s&&c.id==s.cid)}return a}
const visStudents=(all)=>{const ids=visClasses().map(c=>c.id);return D.students.filter(s=>(all||s.st=="a")&&ids.includes(s.cid))};
const used=(k,id)=>{const f={classes:"cid",teachers:"tid",subjects:"sid",students:null}[k];if(k=="students")return Object.values(D.ses).some(s=>id in s.recs);return Object.values(D.ses).some(s=>s[f]==id)||D.assigns.some(a=>a[f]==id)};

newschool:()=>{ui.m={fields:[],h:`<h3>Yangi maktab va direktor yaratish</h3><label>Maktab nomi</label><input id="sc_name" placeholder="masalan: 15-sonli umumiy o'rta ta'lim maktabi"><label>Direktor username</label><input id="sc_dir" placeholder="masalan: director_15"><label>Direktor telefoni</label><input id="sc_tel" placeholder="+998901234567"><div class="ac"><button class="btn gh" data-a="mx">Bekor qilish</button><button class="btn" data-a="donewschool">Yaratish</button></div>`};render()},
donewschool:async()=>{const name=$("#sc_name")?.value.trim(),dirUser=$("#sc_dir")?.value.trim(),dirPhone=$("#sc_tel")?.value.trim();if(!name||!dirUser)return toast("Maktab nomi va direktor username kiriting",1);try{const res=await apiReq("/schools","POST",{name,director_username:dirUser,director_phone:dirPhone});const pw=res.data?.temporary_password;ui.m={h:`<h3>Maktab yaratildi!</h3><p><b>Maktab:</b> ${esc(name)} (Kodi: ${esc(res.data?.school?.code)})</p><p><b>Direktor username:</b> ${esc(dirUser)}</p><div class="nt" style="background:#e8eeff;padding:12px;border:1px solid #3b5bdb;border-radius:10px"><div style="font-size:12px;color:var(--mu);margin-bottom:4px">Direktor uchun vaqtinchalik parol:</div><b style="font-size:20px;letter-spacing:1px;color:#3b5bdb">${esc(pw)}</b></div><p class="mu" style="font-size:12px">Direktor birinchi kirishda parolni almashtirishi shart.</p><div class="ac"><button class="btn" data-a="mx">Tushunarli</button></div>`};render();loadSchools()}catch(err){toast(err.message,1)}},
entersupport:async d=>{try{await apiReq("/auth/support-mode","POST",{school_id:+d.id});toast("Maktab yordam rejimiga o'tildi");await refreshData()}catch(err){toast(err.message,1)}},
exitsupport:async()=>{try{await apiReq("/auth/exit-support-mode","POST");toast("Yordam rejimidan chiqildi");await refreshData()}catch(err){toast(err.message,1)}},
seedxatirchi:async()=>{ask("Xatirchi tumani 65-maktab (22 ta sinf, fanlar, o'qituvchilar va namunaviy o'quvchilar) bazaga to'liq sozlanib yuklansinmi?",async()=>{try{const res=await apiReq("/owner/seed-xatirchi","POST");toast("65-maktab to'liq sozlandi ✓");await loadSchools();await refreshData()}catch(err){toast(err.message||"Xatolik",1)}},"Ha, sozlash")}
};
function dl(n,t,m){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}catch(e){toast("Yuklab bo'lmadi",1)}}
function go(f){if(ui.dr&&ui.dr.dirty){ask("Saqlanmagan o'zgarishlar bor. Baribir davom etasizmi?",()=>{ui.dr.dirty=0;f();render()},"Davom etish");return}f();render()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;if(b.dataset.a=="ovx"&&e.target!=b)return;if(b.type=="checkbox"||b.tagName=="A")e.preventDefault&&b.tagName=="A"&&e.preventDefault();const f=A[b.dataset.a];if(!f)return;if(b.type=="checkbox"&&b.dataset.a!="day"&&b.dataset.a!="perm")return;if(b.type=="checkbox"&&e.target!=b)return;try{await f(b.dataset)}catch(x){console.error(x);toast(x.message||"Xatolik yuz berdi",1)}if(b.dataset.a!="nav"&&b.dataset.a!="back"&&b.dataset.a!="today"&&b.dataset.a!="ssave")render();if(b.dataset.a=="ssave"&&ui.dr)render()});
document.addEventListener("change",e=>{const t=e.target,c=t.dataset.c;if(!c)return;try{if(c=="role"){if(!location.search.includes("dev=1"))return;D.me={role:t.value,id:0};ui.dr=null;const P=t.value=="teacher"?D.teachers:t.value=="student"?D.students:[];if(P[0])D.me.id=P[0].id;save()}else if(c=="pid"){D.me.id=+t.value;ui.dr=null;save()}else if(c=="date"){if(!t.value)return;go(()=>{ui.date=t.value});return}else if(c.startsWith("f_"))ui.f[c.slice(2)]=t.value||"";else if(c=="sc"||c=="sch")ui[c]=t.value&&+t.value;else ui[c]=t.value}catch(x){console.error(x)}render()});
document.addEventListener("input",e=>{const q=e.target.dataset.q;if(q){ui[q]=e.target.value;render()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id!="rf"||!t.files[0])return;const f=t.files[0],r=new FileReader();r.onload=async()=>{let o;try{o=JSON.parse(r.result)}catch(x){return toast("Fayl JSON emas yoki buzilgan",1)}if(!valid(o))return toast("Bu EduMemory zaxira fayli emas yoki to'liq emas",1);ask("Zaxira ma'lumotlari serverga import qilinsinmi?",async()=>{try{const res=await apiReq("/import","POST",o);toast("Zaxira import qilindi ✓");await refreshData()}catch(err){toast(err.message||"Import xatosi",1)}},"Ha, import qilish")};r.onerror=()=>toast("Faylni o'qib bo'lmadi",1);r.readAsText(f);t.value=""});
addEventListener("beforeunload",e=>{if(ui.dr&&ui.dr.dirty){e.preventDefault();e.returnValue=""}});
document.addEventListener("keydown",async e=>{if(e.key=="Enter"&&!ui.isLoggedIn&&(e.target.id=="login_phone"||e.target.id=="login_u"||e.target.id=="login_p")){e.preventDefault();await A.dologin();return}if(e.key=="Enter"&&ui.m&&ui.m.fields&&e.target.tagName=="INPUT"){e.preventDefault();await A.msave();return}if(e.key=="Escape"&&ui.m){ui.m=null;render()}});
try{render();load();if(D?.theme)document.documentElement.dataset.theme=D.theme}catch(e){console.error(e);D=seed();render()}
</script></body></html>
